name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release macOS app
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Install DMG tools
        run: brew install create-dmg

      - name: Import signing certificates
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # Base64 .p12 files for "Developer ID Application" and "Developer ID Installer"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          for P12 in "$DEVELOPER_ID_P12" "$DEVELOPER_ID_INSTALLER_P12"; do
            [ -n "$P12" ] || continue
            echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v "$KEYCHAIN"

      - name: Build, sign and notarize
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_API_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH"
          ./scripts/release.sh
          cp build/release/McFind.dmg build/release/McFind.pkg .

      - name: List files for release
        run: |
          ls -la McFind.dmg McFind.pkg
          shasum -a 256 McFind.dmg McFind.pkg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            McFind.dmg
            McFind.pkg
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(shasum -a 256 McFind.dmg | awk '{print $1}')

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ntufar/homebrew-tap.git" /tmp/homebrew-tap

          cat > /tmp/homebrew-tap/Casks/mcfind.rb <<EOF
          cask "mcfind" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/ntufar/mcfind/releases/download/v#{version}/McFind.dmg"
            name "McFind"
            desc "Fast macOS file search utility inspired by Everything on Windows"
            homepage "https://ntufar.github.io/mcfind/"

            app "McFind.app"

            zap trash: [
              "~/Library/Application Support/McFind",
              "~/Library/Preferences/com.mcfind.McFind.plist",
              "~/Library/Caches/com.mcfind.McFind",
            ]
          end
          EOF

          cd /tmp/homebrew-tap
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add Casks/mcfind.rb
          git commit -m "mcfind ${VERSION}"
          git push
